<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FGR Acompanhamento — novo endereço</title>
<meta http-equiv="refresh" content="0; url=https://acompanhamento-obras.hydra.fgr.com.br/">
<link rel="canonical" href="https://acompanhamento-obras.hydra.fgr.com.br/">
<script>
  // Remove o app antigo guardado no aparelho (service worker + cache) e vai para o endereço novo
  (async () => {
    try {
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));
      }
      if (window.caches) { const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); }
    } catch (e) {}
    location.replace('https://acompanhamento-obras.hydra.fgr.com.br/');
  })();
</script>

  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;

  .box { background: #fff; border-top: 3px solid #A51C1C; border-radius: 8px; padding: 28px 24px; max-width: 420px; margin: 16px; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,.08); }

  </div>
</body>
